<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found · Protocol Explorer</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #fdfdfe; --ink: #00238a; --muted: #5a73a8; --line: #6f94c9; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --ink: #e8eeff; --muted: #9db0d8; --line: #4a6aa8; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      main { max-width: 520px; padding: 24px; }
      .code { font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: var(--muted); }
      h1 { margin: 6px 0 10px; font-size: 32px; letter-spacing: 0.04em; }
      p { margin: 0 0 22px; line-height: 1.6; color: var(--muted); }
      a { display: inline-block; padding: 10px 16px; border: 1px solid var(--line); border-radius: 2px; color: var(--ink); font-weight: 800; letter-spacing: 0.06em; text-decoration: none; }
      a:hover { background: color-mix(in srgb, var(--line) 15%, transparent); }
    </style>
  </head>
  <body>
    <main>
      <div class="code">ICMP TYPE 3 · DESTINATION UNREACHABLE</div>
      <h1>Page not found</h1>
      <p>Nothing is listening at this address. The lessons all live on the home page.</p>
      <a href="./">← PROTOCOL EXPLORER</a>
    </main>
  </body>
</html>
