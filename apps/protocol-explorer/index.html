    <script>
      // the theme, before anything is drawn: the one chosen last time, or the system's
      try {
        const saved = localStorage.getItem('protocol-explorer:theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (saved) for (const meta of document.querySelectorAll('meta[name="theme-color"]')) meta.content = dark ? '#0b1020' : '#fdfdfe'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>

    <!-- 博客整合：返回入口。原站 CSP 为 script-src 'self' + 单一 hash，
         引外部脚本会被拦，所以这里只用内联样式 + 普通链接。
         位置贴着屏幕左边缘（实测侧栏列表从 x=31 起），固定在页面任意角落都会压住
         协议列表项或包表数据，只有这条 22px 的边缘带是真正空白。 -->
    <a class="pe-back" href="../../index.html" aria-label="返回博客首页" title="返回博客">&lsaquo;</a>
    <style>
      .pe-back {
        position: fixed; left: 0; top: 50%; transform: translateY(-50%);
        z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        width: 22px; height: 72px;
        border-radius: 0 10px 10px 0;
        font: 700 15px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-decoration: none;
        color: #00238a; background: rgba(0, 35, 138, .05);
        border: 1px solid rgba(0, 35, 138, .22); border-left: 0;
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        opacity: .8; transition: opacity .18s, width .18s;
      }
      .pe-back:hover, .pe-back:focus-visible {
        opacity: 1; width: 32px;
        background: rgba(0, 35, 138, .12);
      }
      html[data-theme="dark"] .pe-back {
        color: #cfe0ff; background: rgba(232, 238, 255, .09);
        border-color: rgba(232, 238, 255, .26);
      }
      html[data-theme="dark"] .pe-back:hover,
      html[data-theme="dark"] .pe-back:focus-visible { background: rgba(232, 238, 255, .2); }
      @media (max-width: 700px) {
        .pe-back { width: 18px; height: 56px; font-size: 13px; }
        .pe-back:hover, .pe-back:focus-visible { width: 26px; }
      }
      @media (prefers-reduced-motion: reduce) { .pe-back { transition: none; } }

      /* file:// 直接双击本文件时：浏览器会以 CORS 为由拦掉 ES module，#app 永远是空的。
         用 :empty 兜底一句人话（挂载成功后有子节点，这段自动消失）。
         延迟 1.6s 才淡入，正常加载时不会闪。 */
      #app:empty::after {
        content: "Protocol Explorer 需要 HTTP 环境\A\A 浏览器不允许 file:// 页面加载 ES module。\A 请在博客根目录执行：python -m http.server 8080\A 然后访问 http://127.0.0.1:8080/apps/protocol-explorer/";
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        padding: 40px; box-sizing: border-box;
        text-align: center; white-space: pre-line;
        font: 400 14px/2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #00238a; background: #fdfdfe;
        opacity: 0; animation: pe-fallback 0.3s ease 1.6s forwards;
      }
      html[data-theme="dark"] #app:empty::after { color: #9db0d8; background: #121212; }
      @keyframes pe-fallback { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #app:empty::after { animation: none; opacity: 1; }
      }
    </style>
