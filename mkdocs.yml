# SecNotes / Deus's Blog —— MkDocs 站点配置
#
# 这份配置取代了原先「build.py → data/notes.js → index.html」的自研前端，
# 前端效果对齐 FJNU-NISA/NISA-Wiki（同样是 Material for MkDocs）。
#
# 日常写作流程完全不变：
#   1. 用 manage.html / admin.py / 命令行往 notes/ 写 Markdown
#   2. 发布：python tools/sync-docs.py && mkdocs build
#   3. 推送 main 分支后，GitHub Actions 会自动构建并部署到 Pages
#
# 注意：nav 不在这里手写 —— hooks/build_hooks.py 会按 front-matter 的 category
# 自动生成，所以要调整分类顺序请改笔记本身，而不是改这个文件。

site_name: Deus's Blog
site_description: 欢迎访问Deus的个人博客！
site_author: Deus
site_url: https://deus-088.github.io/secnotes/
copyright: ©2026-2026 By Deus

docs_dir: docs
site_dir: site

# 关键：关掉「目录式 URL」。笔记里的图片写作 `assets/uploads/xxx.png`（相对路径），
# 只有当页面地址是 /xxx.html 时才会正确解析到 /assets/uploads/xxx.png；
# 若开启目录式 URL（/xxx/），相对路径会变成 /xxx/assets/...，图片全 404。
use_directory_urls: false

theme:
  name: material
  language: zh
  # 默认会从 fonts.googleapis.com 加载 Roboto（阻塞首屏渲染），国内网络下实测
  # 要 15 秒以上才超时，表现为长时间白屏。关掉即改用系统字体，观感几乎无差别。
  font: false
  features:
    - header.autohide
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.prune
    - navigation.indexes
    - navigation.path
    - toc.follow
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 关闭切换亮暗模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-3
        name: 切换到暗黑模式
      accent: indigo
      primary: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-5
        name: 切换到亮色模式
      accent: indigo
      primary: indigo

# 自动导航 + [[双向链接]] 支持（纯钩子实现，不引入第三方插件，避免生态风险）
hooks:
  - hooks/build_hooks.py

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
      toc_depth: 5
  - tables
  - pymdownx.betterem
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      pygments_lang_class: true
      auto_title: true
      linenums: true
      linenums_style: pymdownx-inline
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.smartsymbols
  - pymdownx.snippets
