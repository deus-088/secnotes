<!-- data/notes.js 改成按需加载：file:// 与中间代理的强缓存会用旧产物，
     用 ?t=时间戳 强制每次都重新拉；第一次加载完成后才启动 app.js。 -->
<script>
(function boot(){
  var V = '?v=20261126a';
  var SOURCES = ['data/notes.js', 'assets/js/app.js'];
  var i = 0;
  function next(){
    if (i >= SOURCES.length) return;
    var src = SOURCES[i++];
    var s = document.createElement('script');
    // 仅给 data/notes.js 加时间戳：app.js 改动频率低，用版本号缓存
    s.src = src + (/notes\.js$/.test(src) ? '?t=' + Date.now() : V);
    s.onload = s.onerror = next;
    document.head.appendChild(s);
  }
  next();
})();
</script>
